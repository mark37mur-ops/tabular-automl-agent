[project]
name = "tabular-automl-agent"
version = "1.0.0"
description = "AutoML agent for unseen tabular tasks: time-aware validation, entity history, seed-bagged gradient boosting ensembles, optional LLM research roles."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.12.0",
    "pandas==2.2.3",
    "pyarrow==19.0.1",
    "scikit-learn==1.5.2",
    "lightgbm==4.6.0",
    "catboost==1.2.8",
    "xgboost==2.1.4",
]

[project.optional-dependencies]
llm = ["openai==1.68.2"]
charts = ["matplotlib==3.9.4"]

[tool.ruff]
line-length = 120
